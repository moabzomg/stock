<!DOCTYPE html>
<html>
<head>
<title>Stock Visualiser</title>
<script src="https://code.highcharts.com/stock/highstock.js"></script>
<script src="https://code.highcharts.com/stock/modules/drag-panes.js"></script>
<script src="https://code.highcharts.com/stock/modules/mouse-wheel-zoom.js"></script>
<script src="https://code.highcharts.com/stock/indicators/indicators.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { background: #0d0d0f; color: #c8c8d0; font-family: 'Courier New', monospace; margin: 0; padding: 0; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid #1e1e26; background: #0d0d0f; flex-wrap: wrap; }
  .topbar h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #5f9fff; white-space: nowrap; }
  select { background: #14141a; color: #c8c8d0; border: 1px solid #2a2a38; padding: 7px 12px; font-size: 13px; font-family: 'Courier New', monospace; border-radius: 3px; cursor: pointer; outline: none; transition: border-color .2s; }
  select:hover, select:focus { border-color: #5f9fff; }
  #symbol { min-width: 220px; }
  #period { min-width: 110px; }
  .ma-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .ma-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #555566; margin-right: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 2px; border: 1px solid transparent; font-size: 12px; font-family: 'Courier New', monospace; font-weight: 700; letter-spacing: .06em; cursor: pointer; user-select: none; transition: all .18s; opacity: .4; }
  .pill.active { opacity: 1; }
  .pill[data-ma="ma200"] { border-color: #ff6b6b; color: #ff6b6b; }
  .pill[data-ma="ma200"].active { background: rgba(255,107,107,.12); }
  .pill[data-ma="ma150"] { border-color: #ffa94d; color: #ffa94d; }
  .pill[data-ma="ma150"].active { background: rgba(255,169,77,.12); }
  .pill[data-ma="ma50"]  { border-color: #69db7c; color: #69db7c; }
  .pill[data-ma="ma50"].active  { background: rgba(105,219,124,.12); }
  #ma-section { display: flex; gap: 8px; align-items: center; }
  .stats-strip { display: flex; gap: 0; border-bottom: 1px solid #1e1e26; overflow-x: auto; background: #0d0d0f; }
  .stat { display: flex; flex-direction: column; padding: 8px 20px; border-right: 1px solid #1a1a24; white-space: nowrap; min-width: 110px; }
  .stat-label { font-size: 9px; letter-spacing: .14em; text-transform: uppercase; color: #444456; margin-bottom: 3px; }
  .stat-value { font-size: 14px; font-weight: 700; color: #e0e0ea; }
  .stat-value.up   { color: #26a69a; }
  .stat-value.down { color: #ef5350; }
  .stat-value.dim  { color: #6a6a80; font-size: 12px; font-weight: 400; }
  #chart { height: 620px; }
  #error { color: #ef5350; font-size: 12px; padding: 8px 24px; display: none; }
  .refresh-badge { font-size: 10px; letter-spacing: .1em; color: #444456; white-space: nowrap; margin-left: auto; }
  .refresh-badge span { color: #5f9fff; }
  .kb-hint { font-size: 10px; color: #333344; letter-spacing: .08em; padding: 5px 24px; border-top: 1px solid #141420; }
  .kb-hint kbd { background: #18181f; border: 1px solid #2a2a38; border-radius: 2px; padding: 1px 5px; font-family: 'Courier New', monospace; color: #555566; font-size: 10px; }
</style>
</head>
<body>

<div class="topbar">
  <h2>&#9658; Stock Visualiser</h2>
  <select id="symbol" onchange="onSymbolChange()">
    <option value="">-- loading --</option>
  </select>
  <select id="period" onchange="onPeriodChange()">
    <option value="daily">Daily</option>
  </select>
  <div id="ma-section">
    <div class="ma-controls">
      <span class="ma-label">MA</span>
      <div class="pill active" data-ma="ma200" onclick="toggleMA(this)">200</div>
      <div class="pill active" data-ma="ma150" onclick="toggleMA(this)">150</div>
      <div class="pill active" data-ma="ma50"  onclick="toggleMA(this)">50</div>
    </div>
  </div>
  <div class="ma-controls">
    <span class="ma-label">TZ</span>
    <select id="timezone" onchange="onTZChange()" style="min-width:unset;padding:5px 8px;font-size:12px;">
      <option value="0">UTC</option>
      <option value="1">UTC+1</option>
      <option value="2">UTC+2</option>
      <option value="3">UTC+3</option>
      <option value="4">UTC+4</option>
      <option value="5">UTC+5</option>
      <option value="5.5">UTC+5:30</option>
      <option value="6">UTC+6</option>
      <option value="7">UTC+7</option>
      <option value="8">UTC+8</option>
      <option value="9">UTC+9</option>
      <option value="9.5">UTC+9:30</option>
      <option value="10">UTC+10</option>
      <option value="11">UTC+11</option>
      <option value="12">UTC+12</option>
      <option value="-1">UTC-1</option>
      <option value="-2">UTC-2</option>
      <option value="-3">UTC-3</option>
      <option value="-3.5">UTC-3:30</option>
      <option value="-4">UTC-4</option>
      <option value="-5">UTC-5 (ET)</option>
      <option value="-6">UTC-6 (CT)</option>
      <option value="-7">UTC-7 (MT)</option>
      <option value="-8">UTC-8 (PT)</option>
      <option value="-9">UTC-9</option>
      <option value="-10">UTC-10</option>
      <option value="-11">UTC-11</option>
      <option value="-12">UTC-12</option>
    </select>
  </div>
  <div class="refresh-badge">auto-refresh <span id="countdown">30</span>s</div>
</div>

<div class="stats-strip">
  <div class="stat"><span class="stat-label">Symbol</span><span class="stat-value dim" id="st-symbol">-</span></div>
  <div class="stat"><span class="stat-label">Last Price</span><span class="stat-value" id="st-price">-</span></div>
  <div class="stat"><span class="stat-label">Volume</span><span class="stat-value" id="st-vol">-</span></div>
  <div class="stat" id="ma200-stat"><span class="stat-label">MA 200</span><span class="stat-value" id="st-ma200">-</span></div>
  <div class="stat" id="ma150-stat"><span class="stat-label">MA 150</span><span class="stat-value" id="st-ma150">-</span></div>
  <div class="stat" id="ma50-stat"><span class="stat-label">MA 50</span><span class="stat-value" id="st-ma50">-</span></div>
</div>

<div id="error"></div>
<div id="chart"></div>
<div class="kb-hint">
  <kbd>&larr;</kbd><kbd>&rarr;</kbd> pan &nbsp;
  <kbd>+</kbd><kbd>-</kbd> zoom &nbsp;
  scroll wheel to zoom &nbsp;
  drag to pan
</div>

<script>
let catalogue     = [];
// Saved xAxis extremes: updated by afterSetExtremes on every user interaction,
// restored after auto-refresh so the view does not jump back to the default range.
// Cleared to null on symbol/period/TZ changes so those start fresh.
let savedExtremes = null;
// True during Highcharts.stockChart() initialisation - prevents afterSetExtremes
// from overwriting savedExtremes with the newly-created chart's default range.
let blockSave     = false;

// Cached DOM references
const EL = {
  symbol:    document.getElementById('st-symbol'),
  price:     document.getElementById('st-price'),
  vol:       document.getElementById('st-vol'),
  ma200:     document.getElementById('st-ma200'),
  ma150:     document.getElementById('st-ma150'),
  ma50:      document.getElementById('st-ma50'),
  countdown: document.getElementById('countdown'),
  error:     document.getElementById('error'),
  maSection: document.getElementById('ma-section'),
  ma200stat: document.getElementById('ma200-stat'),
  ma150stat: document.getElementById('ma150-stat'),
  ma50stat:  document.getElementById('ma50-stat'),
};

// Fetch helper - returns text or null, never throws
async function fetchText(url) {
  try {
    const r = await fetch(url);
    return r.ok ? r.text() : null;
  } catch { return null; }
}

// Price CSV parser - index-based, no per-row object allocation
// Row layout: [ts, open, close, high, low, volume]
function parseCSVFast(text) {
  const nl   = text.indexOf('\n');
  const cols = text.slice(0, nl).split(',').map(s => s.trim());
  const iDT = cols.findIndex(c => c === 'datetime' || c === 'date');
  const iO  = cols.indexOf('open');
  const iC  = cols.indexOf('close');
  const iH  = cols.indexOf('high');
  const iL  = cols.indexOf('low');
  const iV  = cols.indexOf('volume');

  const rows = [];
  let pos = nl + 1;
  const len = text.length;

  while (pos < len) {
    let end = text.indexOf('\n', pos);
    if (end === -1) end = len;
    const line = text.slice(pos, end).trimEnd();
    pos = end + 1;
    if (!line) continue;

    const f = line.split(',');
    if (f.length < 2) continue;

    const d = f[iDT];
    let ts = 0;
    if (d.length >= 12) {
      ts = Date.UTC(d.slice(0,4)|0, (d.slice(4,6)|0)-1, d.slice(6,8)|0,
                    d.slice(8,10)|0, d.slice(10,12)|0, 0);
    } else if (d.length >= 8) {
      ts = Date.UTC(d.slice(0,4)|0, (d.slice(4,6)|0)-1, d.slice(6,8)|0);
    }

    rows.push([ts, +f[iO], +f[iC], +f[iH], +f[iL], +f[iV]]);
  }
  return rows;
}

// Parse MA CSV and populate output arrays in a single pass - no intermediate array.
// Returns { ma200, ma150, ma50, latest }
function buildMAData(text) {
  const out = { ma200: [], ma150: [], ma50: [], latest: null };
  if (!text) return out;

  const nl   = text.indexOf('\n');
  const cols = text.slice(0, nl).split(',').map(s => s.trim());
  const iDT  = cols.findIndex(c => c === 'datetime' || c === 'date' || c === 'YYYYMMDD');
  const i200 = cols.indexOf('ma200');
  const i150 = cols.indexOf('ma150');
  const i50  = cols.indexOf('ma50');

  let pos = nl + 1;
  const len = text.length;

  while (pos < len) {
    let end = text.indexOf('\n', pos);
    if (end === -1) end = len;
    const line = text.slice(pos, end).trimEnd();
    pos = end + 1;
    if (!line) continue;

    const f   = line.split(',');
    const raw = f[iDT] ?? '';
    if (raw.length < 8) continue;

    // Handle both YYYYMMDD and YYYY-MM-DD without regex
    const sep = raw.charCodeAt(4) === 45; // 45 = '-'
    const ts  = Date.UTC(
      raw.slice(0, 4) | 0,
      (raw.slice(sep ? 5 : 4, sep ? 7 : 6) | 0) - 1,
      raw.slice(sep ? 8 : 6, sep ? 10 : 8) | 0
    );

    const v200 = +f[i200], v150 = +f[i150], v50 = +f[i50];
    if (v200 > 0) out.ma200.push([ts, v200]);
    if (v150 > 0) out.ma150.push([ts, v150]);
    if (v50  > 0) out.ma50.push([ts, v50]);
    out.latest = [ts, v200, v150, v50];
  }
  return out;
}

// Slice to last N calendar days via binary search
function sliceLastDays(rows, n) {
  if (!rows.length) return rows;
  const DAY     = 86_400_000;
  const lastTs  = rows[rows.length - 1][0];
  const lastDay = lastTs - (lastTs % DAY);
  const cutoff  = lastDay - (n - 1) * DAY;
  let lo = 0, hi = rows.length;
  while (lo < hi) {
    const mid = (lo + hi) >>> 1;
    if (rows[mid][0] < cutoff) lo = mid + 1; else hi = mid;
  }
  return rows.slice(lo);
}

// Formatting helpers
function fmtNum(n) {
  if (!isFinite(n) || n < 0) return '-';
  return n.toLocaleString('en-GB', { maximumFractionDigits: 4 });
}
function fmtVol(n) {
  if (!isFinite(n) || n <= 0) return '-';
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
function getTZOffsetMs() {
  return (parseFloat(document.getElementById('timezone').value) || 0) * 3_600_000;
}

// MA toggle
const maVisible     = { ma200: true, ma150: true, ma50: true };
const maSeriesIndex = { ma200: 2,    ma150: 3,    ma50: 4    };

function toggleMA(el) {
  const key = el.dataset.ma;
  maVisible[key] = !maVisible[key];
  el.classList.toggle('active', maVisible[key]);
  const chart = Highcharts.charts[0];
  if (chart) {
    const s = chart.series[maSeriesIndex[key]];
    if (s) maVisible[key] ? s.show() : s.hide();
  }
}

// Symbol change: reset saved range (new instrument = new context)
function onSymbolChange() {
  savedExtremes = null;
  const sym   = document.getElementById('symbol').value;
  const entry = catalogue.find(e => e.symbol === sym);
  const sel   = document.getElementById('period');
  const prev  = sel.value;
  sel.innerHTML = '';
  if (entry) {
    for (const p of entry.periods) {
      const opt = document.createElement('option');
      opt.value = p;
      opt.text  = p[0].toUpperCase() + p.slice(1);
      sel.appendChild(opt);
    }
    if (entry.periods.includes(prev)) sel.value = prev;
  }
  load();
}

// Period change: reset saved range (different timescale)
function onPeriodChange() {
  savedExtremes = null;
  load();
}

// TZ change: reset saved range (display timestamps shift, old extremes would be wrong)
function onTZChange() {
  savedExtremes = null;
  load();
}

function setMAVisibility(show) {
  const v = show ? '' : 'none';
  EL.maSection.style.display = v;
  EL.ma200stat.style.display = v;
  EL.ma150stat.style.display = v;
  EL.ma50stat.style.display  = v;
}

// Main load.
// preserve=true (auto-refresh): keeps savedExtremes so the view is restored after redraw.
// preserve=false (user action): clears savedExtremes so chart opens at its default range.
async function load(preserve = false) {
  const sym    = document.getElementById('symbol').value;
  const period = document.getElementById('period').value;
  if (!sym || !period) return;
  showError('');

  if (!preserve) savedExtremes = null;

  const isDaily = period === 'daily';
  const tzOff   = getTZOffsetMs();
  setMAVisibility(isDaily);

  const [mainText, maText] = await Promise.all([
    fetchText(`${sym}_${period}.csv`),
    isDaily ? fetchText(`${sym}_ma.csv`) : Promise.resolve(null)
  ]);

  if (!mainText) { showError('No data for ' + sym); return; }

  const rows = sliceLastDays(parseCSVFast(mainText), 30);

  // Pre-allocated arrays filled by index
  const ohlc   = new Array(rows.length);
  const volume = new Array(rows.length);
  for (let i = 0; i < rows.length; i++) {
    const r  = rows[i];
    const ts = r[0] - tzOff;
    ohlc[i]   = [ts, r[1], r[3], r[4], r[2]]; // open, high, low, close
    volume[i] = [ts, r[5]];
  }

  // Single-pass MA parse
  const { ma200: ma200data, ma150: ma150data, ma50: ma50data, latest: latestMA }
    = isDaily ? buildMAData(maText) : { ma200: [], ma150: [], ma50: [], latest: null };

  // Stats strip
  const last = rows[rows.length - 1];
  const prev = rows[rows.length - 2];

  EL.symbol.textContent = sym.toUpperCase() + ' \xb7 ' + period;

  if (last) {
    const close = last[2], prevClose = prev?.[2];
    EL.price.textContent = fmtNum(close);
    EL.price.className   = 'stat-value' + (prevClose != null ? (close >= prevClose ? ' up' : ' down') : '');
    EL.vol.textContent   = fmtVol(last[5]);
  }

  if (isDaily && latestMA) {
    EL.ma200.textContent = latestMA[1] > 0 ? fmtNum(latestMA[1]) : '-';
    EL.ma150.textContent = latestMA[2] > 0 ? fmtNum(latestMA[2]) : '-';
    EL.ma50.textContent  = latestMA[3] > 0 ? fmtNum(latestMA[3]) : '-';
  }

  if (Highcharts.charts[0]) Highcharts.charts[0].destroy();

  // Block afterSetExtremes while the chart initialises so it cannot overwrite
  // savedExtremes with the brand-new chart's default range.
  blockSave = true;
  const chart = Highcharts.stockChart('chart', {
    time:  { useUTC: true },
    chart: {
      backgroundColor: '#0d0d0f',
      style: { fontFamily: "'Courier New', monospace" },
      animation: false,
      zooming: {
        mouseWheel: { enabled: true, type: 'x' }
      }
    },
    title: { text: null },
    rangeSelector: {
      enabled: true,
      inputEnabled: true,
      selected: isDaily ? 5 : 4,
      buttons: isDaily
        ? [
            { type: 'month', count: 1,  text: '1M'  },
            { type: 'month', count: 3,  text: '3M'  },
            { type: 'month', count: 6,  text: '6M'  },
            { type: 'ytd',              text: 'YTD' },
            { type: 'year',  count: 1,  text: '1Y'  },
            { type: 'all',              text: 'All' }
          ]
        : [
            { type: 'hour',  count: 1,  text: '1H'  },
            { type: 'hour',  count: 4,  text: '4H'  },
            { type: 'day',   count: 1,  text: '1D'  },
            { type: 'week',  count: 1,  text: '1W'  },
            { type: 'all',              text: 'All' }
          ],
      buttonTheme: {
        fill: '#14141a', stroke: '#2a2a38', r: 2,
        style: { color: '#888899', fontFamily: "'Courier New', monospace" },
        states: {
          hover:  { fill: '#1e1e2a', style: { color: '#c8c8d0' } },
          select: { fill: '#5f9fff22', style: { color: '#5f9fff' } }
        }
      },
      inputStyle:  { color: '#c8c8d0', backgroundColor: '#14141a', fontFamily: "'Courier New', monospace", fontSize: '12px' },
      inputBoxBorderColor: '#2a2a38',
      inputBoxWidth: 100,
      labelStyle:  { color: '#555566' }
    },
    navigator: {
      enabled: true, maskFill: 'rgba(95,159,255,0.08)', outlineColor: '#2a2a38',
      handles: { backgroundColor: '#2a2a38', borderColor: '#5f9fff' },
      series:  { color: '#5f9fff', lineWidth: 1 }
    },
    scrollbar: {
      enabled: true, barBackgroundColor: '#2a2a38', barBorderColor: '#2a2a38',
      buttonBackgroundColor: '#14141a', buttonBorderColor: '#2a2a38',
      rifleColor: '#5f9fff', trackBackgroundColor: '#14141a', trackBorderColor: '#1a1a24'
    },
    xAxis: {
      gridLineColor: '#1a1a24', lineColor: '#1e1e26', tickColor: '#1e1e26',
      labels: { style: { color: '#555566', fontSize: '11px' } },
      events: {
        // Track every view change so auto-refresh can restore the exact position.
        afterSetExtremes(e) {
          if (!blockSave) savedExtremes = { min: e.min, max: e.max };
        }
      }
    },
    yAxis: [
      {
        labels: { style: { color: '#777788', fontSize: '11px' }, align: 'right', x: -6 },
        gridLineColor: '#1a1a24', height: '68%',
        resize: { enabled: true },
        crosshair: { color: '#2a2a3844', dashStyle: 'Dot' }
      },
      {
        labels: { style: { color: '#444456', fontSize: '10px' }, align: 'right', x: -6 },
        gridLineColor: '#14141a', top: '73%', height: '27%', offset: 0
      }
    ],
    tooltip: {
      split: true, backgroundColor: '#14141a', borderColor: '#2a2a38', borderRadius: 3,
      style: { color: '#c8c8d0', fontFamily: "'Courier New', monospace", fontSize: '12px' }
    },
    legend: {
      enabled: true, align: 'right', verticalAlign: 'top', layout: 'horizontal',
      itemStyle:      { color: '#777788', fontFamily: "'Courier New', monospace", fontSize: '11px', fontWeight: '400' },
      itemHoverStyle: { color: '#c8c8d0' }
    },
    plotOptions: {
      series:      { animation: false },
      candlestick: { groupPadding: 0.05 }
    },
    series: [
      {
        type: 'candlestick', name: sym.toUpperCase(), data: ohlc, yAxis: 0,
        upColor: '#26a69a', color: '#ef5350', upLineColor: '#26a69a', lineColor: '#ef5350',
        showInLegend: false
      },
      {
        type: 'column', name: 'Volume', data: volume, yAxis: 1,
        color: 'rgba(95,159,255,0.25)', borderWidth: 0, showInLegend: false
      },
      { type: 'line', name: 'MA 200', data: ma200data, yAxis: 0, color: '#ff6b6b', lineWidth: 1.5, marker: { enabled: false }, visible: maVisible.ma200, enableMouseTracking: true, states: { hover: { lineWidthPlus: 0 } } },
      { type: 'line', name: 'MA 150', data: ma150data, yAxis: 0, color: '#ffa94d', lineWidth: 1.5, marker: { enabled: false }, visible: maVisible.ma150, enableMouseTracking: true, states: { hover: { lineWidthPlus: 0 } } },
      { type: 'line', name: 'MA 50',  data: ma50data,  yAxis: 0, color: '#69db7c', lineWidth: 1.5, marker: { enabled: false }, visible: maVisible.ma50,  enableMouseTracking: true, states: { hover: { lineWidthPlus: 0 } } }
    ],
    credits: { enabled: false }
  });
  blockSave = false;

  // Restore the view the user had before the auto-refresh redraw.
  // setExtremes fires afterSetExtremes (blockSave is false now), which re-saves
  // the same values - harmless.
  if (savedExtremes) {
    chart.xAxis[0].setExtremes(savedExtremes.min, savedExtremes.max, true, false);
  }
}

// Keyboard navigation - arrow keys pan, +/- zoom
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const chart = Highcharts.charts[0];
  if (!chart) return;

  const xAxis = chart.xAxis[0];
  const { min, max, dataMin, dataMax } = xAxis.getExtremes();
  const range = max - min;
  const step  = range * 0.2;

  let newMin = min, newMax = max, handled = true;

  switch (e.key) {
    case 'ArrowLeft':
      newMin = Math.max(dataMin, min - step);
      newMax = newMin + range;
      break;
    case 'ArrowRight':
      newMax = Math.min(dataMax, max + step);
      newMin = newMax - range;
      break;
    case '+':
    case '=': {
      const z = range * 0.2;
      if (range - z * 2 > 60_000) { newMin = min + z; newMax = max - z; }
      break;
    }
    case '-': {
      const z = range * 0.25;
      newMin = Math.max(dataMin, min - z);
      newMax = Math.min(dataMax, max + z);
      break;
    }
    default:
      handled = false;
  }

  if (handled) {
    e.preventDefault();
    xAxis.setExtremes(newMin, newMax, true, false);
    // afterSetExtremes fires here and saves the new position to savedExtremes
  }
});

// Auto-refresh - passes preserve=true so the current view is kept
let countdown = 30;
setInterval(() => {
  EL.countdown.textContent = --countdown;
  if (countdown <= 0) { countdown = 30; load(true); }
}, 1000);

function showError(msg) {
  EL.error.style.display = msg ? 'block' : 'none';
  EL.error.innerText = msg;
}

// Init
async function init() {
  try {
    catalogue = await (await fetch('/list')).json();
    const sel  = document.getElementById('symbol');
    const frag = document.createDocumentFragment();
    const ph   = document.createElement('option');
    ph.value = '';
    ph.text  = '-- select symbol --';
    frag.appendChild(ph);
    for (const { symbol } of catalogue) {
      const opt = document.createElement('option');
      opt.value = symbol;
      opt.text  = symbol.toUpperCase();
      frag.appendChild(opt);
    }
    sel.innerHTML = '';
    sel.appendChild(frag);
  } catch (e) {
    showError('Could not load symbol list: ' + e.message);
  }
}

init();
</script>
</body>
</html>
